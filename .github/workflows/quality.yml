name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate data and Python
        run: |
          python -m unittest discover -s tests
          python -m py_compile app.py scripts/update_official_data.py scripts/validate_menu_data.py
          python scripts/validate_menu_data.py
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vercel-app/package-lock.json
      - name: Install and validate Next.js
        working-directory: vercel-app
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
